name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # adds a manual "Run workflow" button

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: http://jupiter.cloud.planittesting.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run lint

      - name: Run test suite
        run: npm run test:ci

      - name: TC2 stability (5 runs, no retries)
        run: npm run test:tc2:x5
        env:
          JUNIT_FILE: results/junit-tc2-x5.xml
          PLAYWRIGHT_HTML_REPORT: playwright-report-tc2-x5

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports
          path: |
            playwright-report/
            playwright-report-tc2-x5/
            results/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
